<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%" fill="none">
  <defs>
    <!-- Ambient Radial Lighting Glows -->
    <radialGradient id="heroGlowPrimary" cx="50%" cy="40%" r="55%" fx="50%" fy="35%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#f59e0b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="accentAura" cx="65%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients for Portrait Silhouette & Layers -->
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="80%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>

    <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.03" />
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filter for soft blur -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="12" result="blur" />
    </filter>

    <linearGradient id="bottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" stop-opacity="0" />
      <stop offset="85%" stop-color="#090a0f" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#090a0f" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="300" cy="270" r="260" fill="url(#heroGlowPrimary)" filter="url(#softGlow)" />
  <circle cx="380" cy="220" r="180" fill="url(#accentAura)" filter="url(#softGlow)" />

  <!-- Subtle Tech Coordinate Grid in Background -->
  <g opacity="0.35">
    <circle cx="300" cy="300" r="240" stroke="url(#gridGrad)" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="300" cy="300" r="190" stroke="url(#gridGrad)" stroke-width="1" />
    <circle cx="300" cy="300" r="140" stroke="url(#gridGrad)" stroke-width="0.75" stroke-dasharray="2 4" />
    <line x1="60" y1="300" x2="540" y2="300" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="6 6" />
    <line x1="300" y1="60" x2="300" y2="540" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="6 6" />
  </g>

  <!-- Data Nodes Floating Points -->
  <circle cx="160" cy="180" r="3.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="440" cy="190" r="3" fill="#fbbf24" opacity="0.9" />
  <circle cx="470" cy="320" r="2.5" fill="#818cf8" opacity="0.7" />
  <circle cx="130" cy="340" r="2" fill="#38bdf8" opacity="0.6" />
  <line x1="160" y1="180" x2="200" y2="230" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
  <line x1="440" y1="190" x2="410" y2="240" stroke="#fbbf24" stroke-opacity="0.2" stroke-width="1" />

  <!-- Silhouette & Portrait Structure -->
  <g id="portraitGroup">
    <!-- Outer Edge Glow for Silhouette -->
    <path d="M 300 130 C 235 130 195 180 195 255 C 195 320 225 365 260 385 L 255 425 C 205 440 140 480 110 560 L 110 680 L 490 680 L 490 560 C 460 480 395 440 345 425 L 340 385 C 375 365 405 320 405 255 C 405 180 365 130 300 130 Z" 
          fill="none" stroke="url(#edgeHighlight)" stroke-width="3" filter="url(#subtleGlow)" opacity="0.85" />

    <!-- Main Head and Torso Silhouette -->
    <path d="M 300 132 C 238 132 200 182 200 255 C 200 318 228 362 262 382 L 257 425 C 208 440 145 480 115 560 L 115 690 L 485 690 L 485 560 C 455 480 392 440 343 425 L 338 382 C 372 362 400 318 400 255 C 400 182 362 132 300 132 Z" 
          fill="url(#silhouetteGrad)" />

    <!-- Sleek Collar / Shirt Line Details in Modern Editorial Tone -->
    <path d="M 265 425 L 300 485 L 335 425" stroke="#475569" stroke-width="2" fill="none" opacity="0.6" />
    <path d="M 300 485 L 300 680" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.5" />
    <path d="M 230 460 C 270 480 330 480 370 460" stroke="#475569" stroke-width="1.5" fill="none" opacity="0.4" />

    <!-- Subtle Hair / Face Geometry Highlights -->
    <path d="M 230 230 C 240 165 300 150 340 160 C 370 170 380 200 380 240 C 365 210 330 190 290 195 C 255 200 240 215 230 230 Z" 
          fill="#475569" opacity="0.5" />
    <path d="M 290 260 L 310 260 L 300 295 Z" fill="#64748b" opacity="0.3" />
    
    <!-- Spectacle/Intellectual Tech Line accents -->
    <circle cx="265" cy="245" r="18" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.45" />
    <circle cx="335" cy="245" r="18" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.45" />
    <line x1="283" y1="245" x2="317" y2="245" stroke="#38bdf8" stroke-width="1.5" opacity="0.45" />

    <!-- Bottom Fade to Seamless Dark Canvas -->
    <rect x="0" y="550" width="600" height="150" fill="url(#bottomFade)" />
  </g>

  <!-- Floating Tech Badges (Modern Glassmorphic Chips) -->
  <g transform="translate(50, 360)">
    <rect width="175" height="54" rx="27" fill="#0f172a" fill-opacity="0.8" stroke="url(#glassBorder)" stroke-width="1.2" />
    <circle cx="27" cy="27" r="14" fill="#38bdf8" fill-opacity="0.15" />
    <text x="27" y="31" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">NIT</text>
    <text x="52" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">NIT Warangal</text>
    <text x="52" y="39" font-family="system-ui, sans-serif" font-size="10" font-weight="400" fill="#94a3b8">B.Tech CSE '24</text>
  </g>

  <g transform="translate(370, 410)">
    <rect width="180" height="54" rx="27" fill="#0f172a" fill-opacity="0.8" stroke="url(#glassBorder)" stroke-width="1.2" />
    <circle cx="27" cy="27" r="14" fill="#f59e0b" fill-opacity="0.15" />
    <text x="27" y="31" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">AI</text>
    <text x="52" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Business + AI</text>
    <text x="52" y="39" font-family="system-ui, sans-serif" font-size="10" font-weight="400" fill="#94a3b8">Data-Driven Core</text>
  </g>
</svg>
