<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ragGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11151e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0c10" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="500" height="280" rx="4" fill="#090b10"/>
  <rect x="1" y="1" width="498" height="278" rx="3" fill="url(#ragGlow)" stroke="#1e2636" stroke-width="1"/>

  <!-- Background Grid -->
  <g opacity="0.1">
    <line x1="0" y1="70" x2="500" y2="70" stroke="#38bdf8" stroke-dasharray="4 6"/>
    <line x1="0" y1="140" x2="500" y2="140" stroke="#38bdf8" stroke-dasharray="4 6"/>
    <line x1="0" y1="210" x2="500" y2="210" stroke="#38bdf8" stroke-dasharray="4 6"/>
    <line x1="125" y1="0" x2="125" y2="280" stroke="#38bdf8" stroke-dasharray="4 6"/>
    <line x1="250" y1="0" x2="250" y2="280" stroke="#38bdf8" stroke-dasharray="4 6"/>
    <line x1="375" y1="0" x2="375" y2="280" stroke="#38bdf8" stroke-dasharray="4 6"/>
  </g>

  <!-- Flow Lines -->
  <path d="M 115 140 L 165 140" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 235 140 L 285 140" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 355 140 L 405 140" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
  
  <!-- Node 1: Documents / Knowledge Base -->
  <g transform="translate(45, 95)">
    <rect width="70" height="90" rx="3" fill="url(#cardGrad)" stroke="#1e2636" stroke-width="1.2"/>
    <rect x="15" y="20" width="40" height="4" rx="1" fill="#38bdf8" opacity="0.8"/>
    <rect x="15" y="32" width="32" height="4" rx="1" fill="#64748b" opacity="0.6"/>
    <rect x="15" y="44" width="36" height="4" rx="1" fill="#64748b" opacity="0.6"/>
    <rect x="15" y="56" width="24" height="4" rx="1" fill="#64748b" opacity="0.6"/>
    <text x="35" y="80" fill="#f0f4f8" font-size="8.5" font-family="monospace" text-anchor="middle" font-weight="600">SOURCE DOCS</text>
  </g>

  <!-- Node 2: Vector Embeddings -->
  <g transform="translate(165, 95)">
    <rect width="70" height="90" rx="3" fill="url(#cardGrad)" stroke="#1e2636" stroke-width="1.2"/>
    <circle cx="35" cy="38" r="16" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1"/>
    <circle cx="35" cy="38" r="6" fill="#0284c7" fill-opacity="0.6"/>
    <circle cx="20" cy="24" r="2.5" fill="#38bdf8"/>
    <circle cx="50" cy="52" r="2.5" fill="#38bdf8"/>
    <text x="35" y="80" fill="#f0f4f8" font-size="8.5" font-family="monospace" text-anchor="middle" font-weight="600">VECTORS</text>
  </g>

  <!-- Node 3: Retrieval Augmented Engine -->
  <g transform="translate(285, 95)">
    <rect width="70" height="90" rx="3" fill="url(#cardGrad)" stroke="#1e2636" stroke-width="1.2"/>
    <polygon points="35,22 47,45 23,45" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
    <circle cx="35" cy="40" r="4" fill="#d97706" opacity="0.8"/>
    <text x="35" y="80" fill="#f0f4f8" font-size="8.5" font-family="monospace" text-anchor="middle" font-weight="600">SYNTHESIS</text>
  </g>

  <!-- Node 4: LLM Output -->
  <g transform="translate(405, 95)">
    <rect width="70" height="90" rx="3" fill="url(#cardGrad)" stroke="#1e2636" stroke-width="1.2"/>
    <circle cx="35" cy="38" r="14" fill="#16a34a" fill-opacity="0.15" stroke="#16a34a" stroke-width="1"/>
    <path d="M 28 38 L 33 43 L 43 33" stroke="#22c55e" stroke-width="1.8" fill="none"/>
    <text x="35" y="80" fill="#f0f4f8" font-size="8.5" font-family="monospace" text-anchor="middle" font-weight="600">GROUNDED</text>
  </g>

  <!-- Status Tag -->
  <g transform="translate(340, 22)">
    <rect width="135" height="24" rx="2" fill="#11151e" stroke="#d97706" stroke-width="1"/>
    <circle cx="16" cy="12" r="3" fill="#d97706"/>
    <text x="74" y="16" fill="#d97706" font-size="9" font-family="monospace" text-anchor="middle" font-weight="700" letter-spacing="0.5">IN DEVELOPMENT</text>
  </g>
</svg>
