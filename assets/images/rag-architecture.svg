<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ragGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="500" height="280" rx="16" fill="#0b0f19"/>
  <rect x="1" y="1" width="498" height="278" rx="15" fill="url(#ragGlow)" stroke="#38bdf8" stroke-opacity="0.2"/>

  <!-- Background Grid & Waveforms -->
  <g opacity="0.15">
    <line x1="0" y1="70" x2="500" y2="70" stroke="#38bdf8" stroke-dasharray="4 6"/>
    <line x1="0" y1="140" x2="500" y2="140" stroke="#38bdf8" stroke-dasharray="4 6"/>
    <line x1="0" y1="210" x2="500" y2="210" stroke="#38bdf8" stroke-dasharray="4 6"/>
    <line x1="125" y1="0" x2="125" y2="280" stroke="#38bdf8" stroke-dasharray="4 6"/>
    <line x1="250" y1="0" x2="250" y2="280" stroke="#38bdf8" stroke-dasharray="4 6"/>
    <line x1="375" y1="0" x2="375" y2="280" stroke="#38bdf8" stroke-dasharray="4 6"/>
  </g>

  <!-- Flow Lines -->
  <path d="M 115 140 L 165 140" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 235 140 L 285 140" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 355 140 L 405 140" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Node 1: Documents / Knowledge Base -->
  <g transform="translate(45, 95)">
    <rect width="70" height="90" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="15" y="20" width="40" height="5" rx="2.5" fill="#38bdf8" opacity="0.8"/>
    <rect x="15" y="32" width="32" height="5" rx="2.5" fill="#94a3b8" opacity="0.6"/>
    <rect x="15" y="44" width="36" height="5" rx="2.5" fill="#94a3b8" opacity="0.6"/>
    <rect x="15" y="56" width="24" height="5" rx="2.5" fill="#94a3b8" opacity="0.6"/>
    <text x="35" y="80" fill="#f8fafc" font-size="9" font-family="system-ui" text-anchor="middle" font-weight="600">Enterprise Docs</text>
  </g>

  <!-- Node 2: Vector Embeddings / Semantic Search -->
  <g transform="translate(165, 95)">
    <rect width="70" height="90" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="35" cy="38" r="16" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.2"/>
    <circle cx="35" cy="38" r="7" fill="#818cf8" fill-opacity="0.6"/>
    <circle cx="20" cy="24" r="3" fill="#38bdf8"/>
    <circle cx="50" cy="52" r="3" fill="#c084fc"/>
    <text x="35" y="80" fill="#f8fafc" font-size="9" font-family="system-ui" text-anchor="middle" font-weight="600">Vector Search</text>
  </g>

  <!-- Node 3: Retrieval Augmented Engine -->
  <g transform="translate(285, 95)">
    <rect width="70" height="90" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <polygon points="35,22 47,45 23,45" fill="#c084fc" fill-opacity="0.3" stroke="#c084fc" stroke-width="1.2"/>
    <circle cx="35" cy="40" r="5" fill="#f43f5e" opacity="0.8"/>
    <text x="35" y="80" fill="#f8fafc" font-size="9" font-family="system-ui" text-anchor="middle" font-weight="600">Context Synth</text>
  </g>

  <!-- Node 4: LLM Response / Business Value -->
  <g transform="translate(405, 95)">
    <rect width="70" height="90" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="35" cy="38" r="14" fill="#34d399" fill-opacity="0.2"/>
    <path d="M 28 38 L 33 43 L 43 33" stroke="#34d399" stroke-width="2" fill="none"/>
    <text x="35" y="80" fill="#f8fafc" font-size="9" font-family="system-ui" text-anchor="middle" font-weight="600">Accurate Output</text>
  </g>

  <!-- Pulsing Active Badge -->
  <g transform="translate(330, 22)">
    <rect width="145" height="28" rx="14" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.5"/>
    <circle cx="16" cy="14" r="4" fill="#fbbf24" filter="url(#nodeGlow)"/>
    <text x="78" y="18" fill="#fbbf24" font-size="10.5" font-family="system-ui" text-anchor="middle" font-weight="700" letter-spacing="0.5">CURRENTLY BUILDING</text>
  </g>
</svg>
