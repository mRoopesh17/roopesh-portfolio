<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="500" height="280" rx="16" fill="#0b0f19"/>
  <rect x="1" y="1" width="498" height="278" rx="15" fill="url(#compGrad)" stroke="#10b981" stroke-opacity="0.25"/>

  <!-- Huffman Binary Tree Structure -->
  <!-- Root Node -->
  <g transform="translate(250, 45)">
    <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="4" fill="#34d399" font-size="11" font-family="monospace" text-anchor="middle" font-weight="bold">100</text>
  </g>

  <!-- Level 1 Connectors -->
  <line x1="237" y1="58" x2="160" y2="105" stroke="#10b981" stroke-width="1.8"/>
  <line x1="263" y1="58" x2="340" y2="105" stroke="#10b981" stroke-width="1.8"/>
  <text x="190" y="76" fill="#10b981" font-size="11" font-family="monospace">0</text>
  <text x="310" y="76" fill="#10b981" font-size="11" font-family="monospace">1</text>

  <!-- Level 1 Nodes -->
  <g transform="translate(160, 115)">
    <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="0" y="4" fill="#6ee7b7" font-size="10" font-family="monospace" text-anchor="middle">45</text>
  </g>
  <g transform="translate(340, 115)">
    <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="0" y="4" fill="#6ee7b7" font-size="10" font-family="monospace" text-anchor="middle">55</text>
  </g>

  <!-- Level 2 Connectors -->
  <line x1="150" y1="128" x2="100" y2="175" stroke="#10b981" stroke-width="1.5"/>
  <line x1="170" y1="128" x2="220" y2="175" stroke="#10b981" stroke-width="1.5"/>
  <line x1="330" y1="128" x2="280" y2="175" stroke="#10b981" stroke-width="1.5"/>
  <line x1="350" y1="128" x2="400" y2="175" stroke="#10b981" stroke-width="1.5"/>

  <!-- Level 2 Leaf Nodes -->
  <g transform="translate(100, 185)">
    <rect x="-18" y="-14" width="36" height="28" rx="6" fill="#047857" stroke="#34d399" stroke-width="1.2"/>
    <text x="0" y="4" fill="#ecfdf5" font-size="10" font-family="monospace" text-anchor="middle" font-weight="bold">'A' : 20</text>
  </g>
  <g transform="translate(220, 185)">
    <rect x="-18" y="-14" width="36" height="28" rx="6" fill="#047857" stroke="#34d399" stroke-width="1.2"/>
    <text x="0" y="4" fill="#ecfdf5" font-size="10" font-family="monospace" text-anchor="middle" font-weight="bold">'B' : 25</text>
  </g>
  <g transform="translate(280, 185)">
    <rect x="-18" y="-14" width="36" height="28" rx="6" fill="#047857" stroke="#34d399" stroke-width="1.2"/>
    <text x="0" y="4" fill="#ecfdf5" font-size="10" font-family="monospace" text-anchor="middle" font-weight="bold">'C' : 25</text>
  </g>
  <g transform="translate(400, 185)">
    <rect x="-18" y="-14" width="36" height="28" rx="6" fill="#047857" stroke="#34d399" stroke-width="1.2"/>
    <text x="0" y="4" fill="#ecfdf5" font-size="10" font-family="monospace" text-anchor="middle" font-weight="bold">'D' : 30</text>
  </g>

  <!-- Metric Badges below -->
  <g transform="translate(140, 235)">
    <rect width="220" height="28" rx="14" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-opacity="0.4"/>
    <text x="110" y="18" fill="#a7f3d0" font-size="11" font-family="monospace" text-anchor="middle">42% Lossless Size Reduction</text>
  </g>
</svg>
