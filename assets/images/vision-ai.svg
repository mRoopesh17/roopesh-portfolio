<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="500" height="280" rx="4" fill="#090b10"/>
  <rect x="1" y="1" width="498" height="278" rx="3" fill="url(#aiGrad)" stroke="#1e2636" stroke-width="1"/>

  <!-- Scanning Reticle & Bounding Box -->
  <g transform="translate(180, 45)">
    <!-- Face Contour Outline -->
    <path d="M 70 20 C 35 20 15 50 15 95 C 15 140 40 170 70 170 C 100 170 125 140 125 95 C 125 50 105 20 70 20 Z" 
          stroke="#0284c7" stroke-width="1.2" stroke-dasharray="3 3" fill="#0284c7" fill-opacity="0.04"/>

    <!-- Facial Landmark Points -->
    <circle cx="50" cy="80" r="2.5" fill="#38bdf8"/>
    <circle cx="90" cy="80" r="2.5" fill="#38bdf8"/>
    <path d="M 40 70 Q 50 65 60 70" stroke="#38bdf8" stroke-width="1.2" fill="none"/>
    <path d="M 80 70 Q 90 65 100 70" stroke="#38bdf8" stroke-width="1.2" fill="none"/>
    <line x1="70" y1="80" x2="70" y2="105" stroke="#0284c7" stroke-width="1"/>
    <circle cx="70" cy="105" r="2" fill="#0284c7"/>
    <path d="M 52 130 Q 70 145 88 130" stroke="#38bdf8" stroke-width="1.5" fill="none"/>

    <line x1="50" y1="80" x2="70" y2="105" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="90" y1="80" x2="70" y2="105" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="70" y1="105" x2="52" y2="130" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="70" y1="105" x2="88" y2="130" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1"/>

    <!-- Corner Brackets of Detector -->
    <path d="M -5 20 L -5 -5 L 20 -5" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <path d="M 120 -5 L 145 -5 L 145 20" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <path d="M -5 165 L -5 190 L 20 190" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <path d="M 120 190 L 145 190 L 145 165" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Left Side: Probabilities -->
  <g transform="translate(35, 75)">
    <text x="0" y="0" fill="#64748b" font-size="9" font-family="monospace">CLASSIFICATION</text>
    <text x="0" y="22" fill="#f0f4f8" font-size="11" font-family="sans-serif" font-weight="600">Happy</text>
    <rect x="0" y="28" width="100" height="3" rx="1" fill="#1e2636"/>
    <rect x="0" y="28" width="88" height="3" rx="1" fill="#22c55e"/>
    <text x="108" y="32" fill="#22c55e" font-size="9" font-family="monospace">88%</text>

    <text x="0" y="52" fill="#94a3b8" font-size="11" font-family="sans-serif">Neutral</text>
    <rect x="0" y="58" width="100" height="3" rx="1" fill="#1e2636"/>
    <rect x="0" y="58" width="09" height="3" rx="1" fill="#64748b"/>
    <text x="108" y="62" fill="#64748b" font-size="9" font-family="monospace">9%</text>

    <text x="0" y="82" fill="#94a3b8" font-size="11" font-family="sans-serif">Surprise</text>
    <rect x="0" y="88" width="100" height="3" rx="1" fill="#1e2636"/>
    <rect x="0" y="88" width="03" height="3" rx="1" fill="#64748b"/>
    <text x="108" y="92" fill="#64748b" font-size="9" font-family="monospace">3%</text>
  </g>

  <!-- Right Side: Pipeline Details -->
  <g transform="translate(355, 75)">
    <text x="0" y="0" fill="#64748b" font-size="9" font-family="monospace">PIPELINE</text>
    <rect x="0" y="12" width="115" height="22" rx="2" fill="#11151e" stroke="#1e2636" stroke-width="1"/>
    <text x="8" y="27" fill="#cbd5e1" font-size="9" font-family="monospace">CNN Architecture</text>

    <rect x="0" y="42" width="115" height="22" rx="2" fill="#11151e" stroke="#1e2636" stroke-width="1"/>
    <text x="8" y="57" fill="#cbd5e1" font-size="9" font-family="monospace">Haar Localization</text>

    <rect x="0" y="72" width="115" height="22" rx="2" fill="#11151e" stroke="#1e2636" stroke-width="1"/>
    <text x="8" y="87" fill="#cbd5e1" font-size="9" font-family="monospace">Real-time Stream</text>
  </g>
</svg>
