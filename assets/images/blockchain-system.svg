<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="blockFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="500" height="280" rx="16" fill="#0b0f19"/>
  <rect x="1" y="1" width="498" height="278" rx="15" fill="url(#bcGrad)" stroke="#06b6d4" stroke-opacity="0.2"/>

  <!-- Isometric Interconnected Cryptographic Blocks -->
  <!-- Block 1 -->
  <g transform="translate(60, 90)">
    <!-- Top Face -->
    <polygon points="55,10 100,32 55,54 10,32" fill="#334155" stroke="#06b6d4" stroke-width="1.2"/>
    <!-- Left Face -->
    <polygon points="10,32 55,54 55,104 10,82" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/>
    <!-- Right Face -->
    <polygon points="55,54 100,32 100,82 55,104" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="55" y="40" fill="#38bdf8" font-size="9" font-family="monospace" text-anchor="middle">HASH #01</text>
  </g>

  <!-- Chain Link 1 -->
  <path d="M 160 148 C 185 148 185 148 210 148" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4"/>
  <circle cx="185" cy="148" r="5" fill="#38bdf8"/>

  <!-- Block 2 (Center / Asset Verified) -->
  <g transform="translate(200, 75)">
    <!-- Top Face -->
    <polygon points="60,10 110,35 60,60 10,35" fill="#3b82f6" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1.5"/>
    <!-- Left Face -->
    <polygon points="10,35 60,60 60,118 10,93" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
    <!-- Right Face -->
    <polygon points="60,60 110,35 110,93 60,118" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
    
    <!-- Shield Icon on Block -->
    <path d="M 60 70 L 72 76 L 72 90 C 72 97 60 103 60 103 C 60 103 48 97 48 90 L 48 76 Z" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.2"/>
    <polyline points="55 86 59 90 66 82" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <text x="60" y="42" fill="#93c5fd" font-size="10" font-family="monospace" text-anchor="middle" font-weight="bold">VERIFIED</text>
  </g>

  <!-- Chain Link 2 -->
  <path d="M 310 148 C 335 148 335 148 360 148" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4"/>
  <circle cx="335" cy="148" r="5" fill="#38bdf8"/>

  <!-- Block 3 -->
  <g transform="translate(350, 90)">
    <polygon points="55,10 100,32 55,54 10,32" fill="#334155" stroke="#06b6d4" stroke-width="1.2"/>
    <polygon points="10,32 55,54 55,104 10,82" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/>
    <polygon points="55,54 100,32 100,82 55,104" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="55" y="40" fill="#38bdf8" font-size="9" font-family="monospace" text-anchor="middle">HASH #03</text>
  </g>

  <!-- Bottom Tag -->
  <g transform="translate(160, 225)">
    <rect width="180" height="28" rx="14" fill="#0369a1" fill-opacity="0.2" stroke="#0284c7" stroke-opacity="0.4"/>
    <text x="90" y="18" fill="#7dd3fc" font-size="10.5" font-family="system-ui" text-anchor="middle" font-weight="600">DECENTRALIZED ASSET AUDIT</text>
  </g>
</svg>
